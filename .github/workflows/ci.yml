name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
    branches: [main]

jobs:
  secrets:
    name: Secrets scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jobscale
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
          pip install apify-client || true
      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium
      - name: Pytest (core waves)
        env:
          ENVIRONMENT: development
          SECRET_KEY: ci-secret-key-not-for-production-use-32chars
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/jobscale
          DATABASE_ASYNC_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/jobscale
          REDIS_URL: redis://localhost:6379/0
          RATE_LIMIT_PER_MINUTE: "0"
          ALLOW_FIXTURE_SUBMIT: "true"
          AUTO_SEED_DEMO_JOBS: "false"
        run: |
          python -m pytest \
            tests/test_wave3_ops.py \
            tests/test_wave4_saas.py \
            tests/test_wave5_monitor.py \
            tests/test_google_oauth.py \
            tests/test_workday_ashby_fixtures.py \
            tests/test_billing_webhooks.py \
            tests/test_alembic_baseline.py \
            tests/test_world_class_saas_honesty.py \
            tests/test_auth_career_wave.py \
            tests/test_connect_boards_e2e.py \
            tests/test_scale_reliability.py \
            -q --tb=line

  frontend:
    name: Frontend typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npx tsc --noEmit
