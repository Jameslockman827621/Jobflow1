<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>iCIMS Apply Fixture</title>
</head>
<body>
  <h1>iCIMS Career Portal — Apply</h1>
  <form id="icims-application" onsubmit="return handleSubmit(event)">
    <label for="jobscale-icims-first">First Name</label>
    <input id="jobscale-icims-first" name="firstname" autocomplete="given-name" required />
    <label for="jobscale-icims-last">Last Name</label>
    <input id="jobscale-icims-last" name="lastname" autocomplete="family-name" required />
    <label for="jobscale-icims-email">Email</label>
    <input id="jobscale-icims-email" name="email" type="email" required />
    <label for="jobscale-icims-phone">Phone</label>
    <input id="jobscale-icims-phone" name="phone" type="tel" />
    <button type="submit" id="submit_app">Submit application</button>
  </form>
  <div id="confirmation" style="display:none">
    <h2>Thank you for applying</h2>
    <p>Your application has been submitted.</p>
  </div>
  <script>
    function handleSubmit(e) {
      e.preventDefault();
      document.getElementById('icims-application').style.display = 'none';
      document.getElementById('confirmation').style.display = 'block';
      history.pushState({}, '', location.pathname + '?submitted=true');
      return false;
    }
  </script>
</body>
</html>
