<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Multi-step Job Application — JobScaleTest</title>
  <style>
    .step { display: none; }
    .step.active { display: block; }
    .error { color: #b91c1c; font-size: 12px; }
  </style>
</head>
<body>
  <h1>Apply for Fixture Engineer</h1>

  <form id="application_form" onsubmit="return handleSubmit(event)">
    <div id="step1" class="step active">
      <h2>Step 1 — Contact</h2>
      <label for="first_name">First Name*</label>
      <input id="first_name" autocomplete="given-name" aria-label="First Name" type="text" required />
      <div id="err_first" class="error" style="display:none">First name required</div>

      <label for="last_name">Last Name*</label>
      <input id="last_name" autocomplete="family-name" aria-label="Last Name" type="text" required />

      <label for="email">Email*</label>
      <input id="email" autocomplete="email" aria-label="Email" type="email" required />

      <button type="button" id="next_btn" onclick="goNext()">Next</button>
    </div>

    <div id="step2" class="step">
      <h2>Step 2 — Questions</h2>
      <label for="phone">Phone</label>
      <input id="phone" type="tel" aria-label="Phone" />

      <label for="question_sponsor">Will you now or in the future require sponsorship for a visa?*</label>
      <input id="question_sponsor" aria-label="Will you now or in the future require sponsorship for a visa?*" type="text" required />

      <button type="button" onclick="goBack()">Back</button>
      <button type="submit" id="submit_app">Submit application</button>
    </div>
  </form>

  <div id="confirmation" style="display:none">
    <h2>Thank you for applying</h2>
    <p>Your application was submitted successfully. We've received your application.</p>
  </div>

  <script>
    function goNext() {
      const first = document.getElementById('first_name');
      const last = document.getElementById('last_name');
      const email = document.getElementById('email');
      if (!first.value || !last.value || !email.value) {
        document.getElementById('err_first').style.display = 'block';
        first.setAttribute('aria-invalid', 'true');
        return;
      }
      first.removeAttribute('aria-invalid');
      document.getElementById('err_first').style.display = 'none';
      document.getElementById('step1').classList.remove('active');
      document.getElementById('step2').classList.add('active');
    }
    function goBack() {
      document.getElementById('step2').classList.remove('active');
      document.getElementById('step1').classList.add('active');
    }
    function handleSubmit(e) {
      e.preventDefault();
      const sponsor = document.getElementById('question_sponsor');
      if (!sponsor.value) {
        sponsor.setAttribute('aria-invalid', 'true');
        return false;
      }
      document.getElementById('application_form').style.display = 'none';
      document.getElementById('confirmation').style.display = 'block';
      history.pushState({}, '', location.pathname + '?submitted=true');
      return false;
    }
  </script>
</body>
</html>
