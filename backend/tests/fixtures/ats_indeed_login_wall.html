<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sign In | Indeed</title>
</head>
<body>
  <h1>Sign in to Indeed</h1>
  <p>Create an account to apply for this job</p>
  <form id="login-form">
    <label for="login-email-input">Email</label>
    <input id="login-email-input" name="email" type="email" />
    <label for="login-password-input">Password</label>
    <input id="login-password-input" name="password" type="password" />
    <button type="submit">Sign in</button>
  </form>
</body>
</html>
