<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Lever Apply — JobScaleTest</title>
</head>
<body>
  <h1>Apply for Fixture Engineer</h1>
  <p>jobs.lever.co fixture</p>
  <form id="application-form" action="/thanks" onsubmit="return handleSubmit(event)">
    <label>Full name*
      <input name="name" type="text" required />
    </label>
    <label>Email*
      <input name="email" type="email" required />
    </label>
    <label>Phone
      <input name="phone" type="tel" />
    </label>
    <label>Current company
      <input name="org" type="text" />
    </label>
    <label>LinkedIn
      <input name="urls[LinkedIn]" type="url" />
    </label>
    <label>Resume
      <input id="resume-upload-input" name="resume" type="file" />
    </label>
    <label>Additional info
      <textarea name="comments"></textarea>
    </label>
    <label>How did you hear about us?
      <select name="cards[hear]">
        <option value="">Select…</option>
        <option value="linkedin">LinkedIn</option>
        <option value="friend">Friend</option>
        <option value="other">Other</option>
      </select>
    </label>
    <button type="submit" id="btn-submit">Submit application</button>
  </form>
  <div id="confirmation" style="display:none">
    <h2>Thank you for applying</h2>
    <p>We've received your application.</p>
  </div>
  <script>
    function handleSubmit(e) {
      e.preventDefault();
      const name = document.querySelector("input[name='name']");
      const email = document.querySelector("input[name='email']");
      if (!name.value || !email.value) return false;
      document.getElementById('application-form').style.display = 'none';
      document.getElementById('confirmation').style.display = 'block';
      history.pushState({}, '', location.pathname + '?submitted=true');
      return false;
    }
  </script>
</body>
</html>
