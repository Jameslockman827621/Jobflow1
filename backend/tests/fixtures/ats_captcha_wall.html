<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Greenhouse Apply — Captcha Wall</title>
</head>
<body>
  <h1>Software Engineer</h1>
  <form id="application" onsubmit="return false;">
    <label for="first_name">First Name</label>
    <input id="first_name" name="first_name" autocomplete="given-name" required />
    <label for="last_name">Last Name</label>
    <input id="last_name" name="last_name" autocomplete="family-name" required />
    <label for="email">Email</label>
    <input id="email" name="email" type="email" required />
    <label for="phone">Phone</label>
    <input id="phone" name="phone" type="tel" />
    <div class="g-recaptcha" data-sitekey="test-site-key-not-real"></div>
    <iframe src="https://www.google.com/recaptcha/api2/anchor?k=test" title="reCAPTCHA"></iframe>
    <button type="submit" id="submit_app">Submit application</button>
  </form>
</body>
</html>
