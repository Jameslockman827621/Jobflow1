version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: jobscale-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: jobscale
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis (cache & task queue)
  redis:
    image: redis:7-alpine
    container_name: jobscale-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: jobscale-backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ../backend:/app
      - apply_tmp:/tmp/jobscale_screenshots
      - resume_tmp:/tmp/jobscale_resumes
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/jobscale
      - DATABASE_ASYNC_URL=postgresql+asyncpg://postgres:postgres@db:5432/jobscale
      - REDIS_URL=redis://redis:6379/0
      - DEBUG=true
      - HEADLESS_APPLY_ENABLED=true
      - HEADLESS_APPLY_AUTO_SUBMIT=true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Celery Worker — scrape/alerts on default queue
  worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: jobscale-worker
    command: celery -A app.tasks.celery_app worker -Q celery --concurrency=2 --loglevel=info
    volumes:
      - ../backend:/app
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/jobscale
      - REDIS_URL=redis://redis:6379/0
      - HEADLESS_APPLY_ENABLED=true
    depends_on:
      - db
      - redis

  # Dedicated apply worker — one Chromium at a time for reliability at scale
  apply-worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: jobscale-apply-worker
    command: celery -A app.tasks.celery_app worker -Q apply --concurrency=1 --loglevel=info
    volumes:
      - ../backend:/app
      - apply_tmp:/tmp/jobscale_screenshots
      - resume_tmp:/tmp/jobscale_resumes
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/jobscale
      - REDIS_URL=redis://redis:6379/0
      - HEADLESS_APPLY_ENABLED=true
      - HEADLESS_APPLY_AUTO_SUBMIT=true
      - CAPTCHA_MOCK=false
      - PROXY_POOL=
    depends_on:
      - db
      - redis
      - worker
    # Scale horizontally with: docker compose up --scale apply-worker=3
    # Keep --concurrency=1 per replica (Playwright memory)

  # Celery Beat (schedules near-real-time + 2h monitoring + stale apply sweeper)
  beat:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: jobscale-beat
    command: celery -A app.tasks.celery_app beat --loglevel=info
    volumes:
      - ../backend:/app
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/jobscale
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
      - worker

  # Frontend (Next.js)
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: jobscale-frontend
    volumes:
      - ../frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  apply_tmp:
  resume_tmp:
